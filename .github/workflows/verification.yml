name: verification

# Ce qui doit rester vrai de ce depot, verifie a chaque poussee.
#
# Les trois invariants sont decrits dans scripts/validate.mjs, chacun ecrit le jour ou il a ete
# rompu. Aucun ne casse bruyamment quand il l'est : une skill hors format n'est simplement jamais
# reprise par l'un des agents, une adresse en dur n'authentifie personne et se lit comme un jeton
# invalide, et une commande publiee sur aucun registre repond 404 au premier client qui la tape.
# C'est exactement le genre de defaut qu'une verification automatique attrape et qu'une relecture
# laisse passer.

on:
  push:
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Le format des skills, l'absence d'adresse, l'absence de commande fantome
        run: node scripts/validate.mjs

      # La garantie produit : aucun verbe n'accepte de code, de diff ni de contenu de fichier.
      # La couche statique ne demande aucun reseau et se joue donc partout.
      - name: La conformite du contrat, couche statique
        run: node cs/contract/conformance/runner.mjs

      - name: Les scripts s'analysent
        run: |
          node --check setup/setup.mjs
          node --check scripts/validate.mjs
          # Les binaires par le motif, pour la meme raison que les hooks : `bin/` est publie tel
          # quel dans le cache du plugin, donc un module ajoute la et absent d'une liste ecrite a
          # la main ne serait lu nulle part avant un poste de client.
          for binary in cs/bin/*.mjs; do node --check "$binary"; done
          # Les hooks par le motif, jamais par la liste : un hook ajoute sans etre ajoute ici
          # serait le seul script publie que rien ne lit avant un poste de client.
          for hook in cs/hooks/*.mjs cs/hooks/*/*.mjs; do node --check "$hook"; done
          for script in scripts/*.mjs; do node --check "$script"; done

      # Le mod qui dessine le panneau a cote de la conversation est du TypeScript execute
      # dans le processus de Claude Code, type contre les declarations que /plugin-types
      # ecrit (types/claude-code.d.ts, dont la premiere ligne nomme sa version). L'API est
      # en acces anticipe : elle peut bouger d'une version a l'autre, et la seule facon de
      # l'apprendre avant un poste de client est de recompiler a chaque poussee.
      - name: Le panneau compile contre les declarations versionnees
        run: npx -y -p typescript@5 tsc -p tsconfig.json

      # Ce que le panneau decide — l'arbre, les deux orthographes, le cache, la mise en
      # forme — vit dans des fonctions pures, parce que `claude plugin test` n'existe pas
      # dans la version installee et que le kit `claude-code/testing` est donc hors de
      # portee. Ces fonctions sont rejouees ici sur les reponses reelles des deux espaces.
      - name: Le panneau rejoue ses contrats sur les deux espaces de travail
        run: node scripts/check-where.mjs

      # The decisions panel the same way: its cards, its groups per agent and its whole sheet are
      # pure functions, replayed on answers in the server's own shape. What reaches the engine
      # itself — the bind, the panes, a press, on the terminal's table and the desktop's — is
      # `cs/hooks/decisions/panel.test.tsx`, which `claude plugin test cs` plays on a workstation:
      # this runner has no Claude Code to play it with.
      - name: Le panneau des décisions rejoue ses contrats
        run: npm run check:decisions

      # La ligne sous le prompt et le hook qui l'alimente, rejoués ensemble sur un banc
      # d'essai en dossier temporaire : aucun réseau, aucune ligne de développeur touchée.
      # Ces contrats existaient sans être joués nulle part, donc sans rien garantir.
      - name: La ligne sous le prompt rejoue ses contrats
        run: npm run check:statusline

      # La projection Codex : chaque `${CLAUDE_PLUGIN_ROOT}/<chemin>` qu'une skill epelle doit
      # exister dans l'arbre que le generateur vient d'ecrire. Sans ce pas, une reference qui ne
      # resout rien sous Codex ne casse rien : l'onglet lit « ouvre ce fichier », ne trouve rien,
      # et continue sans les conventions pour lesquelles on l'y envoyait. C'est reste vrai pour
      # dix-huit references jusqu'au 21 septembre 2026, tous les controles au vert.
      #
      # `--verify` et non `--check` : la sortie est gitignoree, donc un checkout neuf n'en a
      # aucune et `--check` y lit chaque fichier comme une derive. `--check` est le controle du
      # developpeur, sur sa propre projection construite.
      - name: La projection Codex resout ce qu'elle epelle
        run: npm run verify:codex

      # And the same projection run from SOMEWHERE ELSE, against the INSTALLED layout: in a
      # workstation's plugin cache, `skills/`, `instructions/` and `agents/` sit directly under the
      # plugin root, where here they sit under `cs/`. That is the client's journey, and it is
      # played nowhere unless it is played here — the generator could only ever build inside this
      # repository, for as long as it existed, with every check green throughout.
      #
      # It asserts on the PRODUCED TREE, never on the generator's summary. A run that reads its own
      # report is a run that believes whatever it just said.
      - name: La projection tourne depuis un depot hote, sur la disposition installee
        run: |
          set -e
          kit="$(mktemp -d)/cs"
          host="$(mktemp -d)"
          mkdir -p "$kit"
          cp -r cs/. "$kit/"
          cd "$host"
          node "$GITHUB_WORKSPACE/scripts/build-codex.mjs" --plugin-root "$kit" --repo-root . --quiet
          test -f .agents/skills/ship/SKILL.md
          test -f .agents/instructions/host-instructions.md
          test -d .codex/agents
          # The root instruction file is named by role, and the Codex spelling survives the copy.
          grep -q 'AGENTS.md' .agents/instructions/host-instructions.md
          # And nothing was written back into the kit.
          test ! -e "$kit/.agents"
          test ! -e "$kit/.codex"

      # And the same run again, reached the way a CLIENT reaches it: the CLI that ships with the
      # plugin, from their own repository, with no flag at all. The step above proves the generator
      # works from a host repository; it proves nothing about whether anyone can get at it, because
      # it calls a path under `$GITHUB_WORKSPACE`. `scripts/` never reaches a client's machine — the
      # plugin cache mirrors `cs/` alone — so until 21 September 2026 the file was correct and
      # out of reach, and every check above was green the whole time.
      #
      # The two roots are therefore supplied by NOTHING: `--plugin-root` defaults to the installed
      # kit `bin/cs.mjs` sits in, `--repo-root` to the working directory. A flag passed here would
      # test the flag and leave the defaults — which is all a client types — unexercised.
      - name: Un client lance la projection depuis le kit installe, sans aucun drapeau
        run: |
          set -e
          kit="$(mktemp -d)/cs"
          host="$(mktemp -d)"
          mkdir -p "$kit"
          cp -r cs/. "$kit/"
          cd "$host"
          node "$kit/bin/cs.mjs" codex --quiet
          # Read the produced tree, never the summary.
          test -f .agents/skills/feature-implement/SKILL.md
          test -f .agents/instructions/acceptance-criteria.md
          test -f .codex/agents/design-reviewer.toml
          # Every `${CLAUDE_PLUGIN_ROOT}/<path>` the produced files spell opens a real file under
          # `.agents/`, which is what that variable names here. The generator asserts this on its
          # own tree; this reads it back from the disk a client would be looking at.
          spelled="$(grep -rho '\${CLAUDE_PLUGIN_ROOT}/[A-Za-z0-9_./-]*' .agents .codex | sort -u)"
          test -n "$spelled"
          for path in $spelled; do
            test -f ".agents/${path#'${CLAUDE_PLUGIN_ROOT}/'}"
          done
          echo "$spelled" | wc -l
          # The banner names the command a client can actually type, not a file they do not have.
          grep -q 're-run cs codex' .agents/skills/ship/SKILL.md
          # And nothing was written back into the kit.
          test ! -e "$kit/.agents"
          test ! -e "$kit/.codex"

      # Standing INSIDE the installed kit must be refused, whatever the operating system calls the
      # two folders. The guard compares the destination against the kit, and the shipped path reads
      # them from two different places — this file's folder and the working directory — so one
      # directory can arrive under two spellings. It did: a run from inside the kit wrote the
      # projection into the plugin cache, where no Codex tab reads it and the next upgrade deletes
      # it.
      - name: Ecrire dans le kit installe est refuse
        run: |
          set -e
          kit="$(mktemp -d)/cs"
          mkdir -p "$kit"
          cp -r cs/. "$kit/"
          cd "$kit"
          if node "$kit/bin/cs.mjs" codex --quiet; then echo "the guard let it through"; exit 1; fi
          test ! -e "$kit/.agents"
          test ! -e "$kit/.codex"

      - name: Le bac bwrap est obligatoire pour les contrats d'isolation
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          bwrap --version

      - name: Le runner bug-evaluation rejoue ses contrats
        env:
          CASTALIE_BUG_EVALUATION_REQUIRE_SANDBOX: "1"
        run: |
          # Ubuntu's AppArmor user-namespace restriction blocks bwrap's loopback setup with
          # RTM_NEWADDR. This is an ephemeral GitHub VM: temporarily relax only that kernel
          # switch, keep the test as the normal checkout user, and restore the exact value even
          # when the test fails. File capabilities are deliberately not used because bwrap
          # rejects them unless installed setuid.
          apparmor_key=kernel.apparmor_restrict_unprivileged_userns
          if apparmor_value="$(sudo sysctl -n "$apparmor_key" 2>/dev/null)"; then
            echo "$apparmor_key before=$apparmor_value"
            sudo sysctl -w "$apparmor_key=0"
            trap 'sudo sysctl -w "$apparmor_key=$apparmor_value"' EXIT
          else
            echo "$apparmor_key is unavailable; continuing with the host sandbox policy"
          fi
          npm run test:bug-evaluation --prefix cs
